<!-- Logo: "MA". One flowing shape with two peaks reads as the M; arches are cut under each
     peak, a curved slit lifts the tip off the taller peak, and a lime four-point star sits in
     that peak's arch, making it the A. Drawn on a black tile.
     The same drawing is inlined in the header and the loader (index.html) so it can animate. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -15 130 130">
  <title>Maximilian Axel Enolpe</title>
  <rect x="-4" y="-15" width="130" height="130" rx="29" fill="#0A0A0A"/>
  <g transform="translate(61 50) scale(.94) translate(-61 -50)">
    <g class="logo-body">
      <path fill="#FAFAFA" d="M4 88C20 85 27 70 40 28L54 58 73 12 97 62C102 76 108 85 118 88Z"/>
      <path fill="#0A0A0A" d="M24 88C26 72 33 63 40 63C47 63 51 74 50 88Z"/>
      <path fill="#0A0A0A" d="M62 88C60 70 67 58 77 58C87 58 93 72 92 88Z"/>
      <path fill="#0A0A0A" d="M56 50C66 47 80 47 96 54L97 58C82 51 68 51 57 54Z"/>
    </g>
    <path class="logo-star" fill="#A3E635" d="M77 57Q78.4 70 90 71.5Q78.4 73 77 86Q75.6 73 64 71.5Q75.6 70 77 57Z"/>
  </g>
</svg>
